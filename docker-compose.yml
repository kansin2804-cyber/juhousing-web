version: '3.8'

services:
  nginx-web:
    image: nginx:alpine
    container_name: ju_housing_web
    restart: unless-stopped
    ports:
      - "8081:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ju/n8n-media:/data/n8n-media:ro
